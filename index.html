<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Binder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap');

  :root {
    --ink: #1B2430;
    --paper: #F5F6F1;
    --card: #FFFFFF;
    --border: #DDE0D6;
    --accent: #2F6F4F;
    --accent-soft: #E4EFE7;
    --gold: #C08A2E;
    --text: #23282F;
    --text-dim: #6B7280;
    --danger: #B5453A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Public Sans', -apple-system, sans-serif;
    color: var(--text); background: var(--paper);
  }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  #app { display: flex; min-height: 100vh; width: 100%; }

  /* ---------- setup screen ---------- */
  .setup-wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px; }
  .setup-wrap h1 { font-size: 28px; margin: 0 0 6px 0; }
  .setup-wrap > p.lead { color: var(--text-dim); margin: 0 0 28px 0; font-size: 15px; line-height: 1.55; }
  .setup-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 18px; }
  .setup-card h2 { font-size: 16px; margin: 0 0 10px 0; }
  .setup-card ol { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.8; }
  .setup-card ol li { margin-bottom: 4px; }
  .setup-card p.hint { font-size: 13.5px; color: var(--text-dim); margin: 6px 0 0 0; }
  .code-block {
    background: #1B2430; color: #DCE3DA; border-radius: 8px; padding: 12px 14px;
    font-family: ui-monospace, monospace; font-size: 12px; overflow-x: auto;
    white-space: pre; margin: 10px 0; position: relative; line-height: 1.6;
  }
  .copy-btn {
    position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.12);
    color: #fff; border: none; border-radius: 6px; padding: 4px 9px; font-size: 11.5px; cursor: pointer;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }
  .setup-wrap input[type=text] {
    width: 100%; font-size: 14px; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; background: #FCFCFA; margin-bottom: 10px;
  }
  .setup-wrap input[type=text]:focus { outline: none; border-color: var(--accent); }
  .setup-wrap label.field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
  .setup-error {
    background: #FBEAE8; border: 1px solid #E9BAB3; color: var(--danger);
    padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 14px;
  }
  .btn { padding: 10px 18px; border-radius: 8px; font-size: 14.5px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: #275C41; }
  .btn.text { background: none; color: var(--text-dim); }
  .btn.text:hover { color: var(--text); }
  .btn:disabled { opacity: 0.6; cursor: default; }

  /* ---------- sidebar ---------- */
  .sidebar { width: 272px; flex-shrink: 0; background: var(--ink); color: #E8EAE3; display: flex; flex-direction: column; padding: 24px 18px; min-height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-title { font-size: 20px; font-weight: 600; }
  .brand-sub { font-size: 12.5px; color: #9AA3AE; margin-bottom: 22px; }
  .close-btn { display: none; margin-left: auto; color: #B7C0C9; background: none; border: none; cursor: pointer; }

  .chapter-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chapter-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border-left: 3px solid transparent; cursor: pointer; }
  .chapter-item:hover { background: rgba(255,255,255,0.05); }
  .chapter-item.active { background: rgba(255,255,255,0.08); border-left: 3px solid var(--gold); }
  .chapter-num { font-family: 'Fraunces', serif; font-size: 13px; color: #7C8794; width: 20px; flex-shrink: 0; }
  .chapter-title { font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chapter-actions { display: none; gap: 4px; }
  .chapter-item:hover .chapter-actions { display: flex; }
  .icon-btn { background: transparent; border: none; color: #B7C0C9; cursor: pointer; padding: 3px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .icon-btn.dim { color: #6B7280; }

  .rename-row { display: flex; gap: 6px; padding: 6px 4px; align-items: center; }
  .rename-row input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; padding: 6px 8px; font-size: 13.5px; }
  .inline-confirm { margin: 4px 0 8px 0; background: rgba(181,69,58,0.15); border: 1px solid rgba(181,69,58,0.4); padding: 10px; border-radius: 8px; font-size: 12.5px; }
  .inline-confirm p { margin: 0 0 8px 0; color: #E8AFA8; }
  .mini-row { display: flex; gap: 8px; }
  .mini-btn { flex: 1; padding: 7px 0; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; font-weight: 600; }
  .mini-btn.primary { background: var(--gold); color: #1B2430; }
  .mini-btn.ghost { background: rgba(255,255,255,0.08); color: #E8EAE3; }
  .mini-btn.danger { background: #B5453A; color: #fff; }

  .add-chapter { margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; }
  .add-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.25); color: #E8EAE3; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .add-btn:hover { background: rgba(255,255,255,0.1); }
  .add-form { display: flex; flex-direction: column; gap: 8px; }
  .add-form input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 13.5px; }

  .conn-status { font-size: 11.5px; color: #6D7684; margin-top: 12px; display: flex; align-items: center; gap: 6px; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #3E9C6E; flex-shrink: 0; }
  .sidebar-footer-link { font-size: 12px; color: #7C8794; background: none; border: none; cursor: pointer; text-align: left; padding: 4px 0; }
  .sidebar-footer-link:hover { color: #E8935B; }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; padding: 36px 44px; overflow-y: auto; }
  .mobile-bar { display: none; }
  .empty-state { height: 70vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; max-width: 460px; }
  .empty-state h2 { font-size: 26px; margin: 14px 0 8px 0; }
  .empty-state p { color: var(--text-dim); font-size: 15px; line-height: 1.55; margin: 0 0 18px 0; }

  .chapter-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .chapter-header h1 { font-size: 30px; font-weight: 600; margin: 0; line-height: 1.2; }
  .chapter-eyebrow { font-size: 13px; color: var(--text-dim); margin: 0 0 4px 0; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 26px; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 10px 4px; margin-right: 26px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 14.5px; color: var(--text-dim); font-weight: 500; }
  .tab.active { color: var(--ink); border-bottom: 2px solid var(--accent); }

  .panel { display: none; }
  .panel.active { display: block; }
  .panel-empty { border: 1px dashed var(--border); border-radius: 12px; padding: 30px 26px; color: var(--text-dim); font-size: 14.5px; background: rgba(255,255,255,0.5); }
  .panel-empty strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 15px; }

  .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .form-grid { display: flex; flex-direction: column; gap: 10px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
  .field input[type=text], .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; background: #FCFCFA; }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; align-items: center; }

  .file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .file-choose-btn { border: 1px solid var(--border); background: #FCFCFA; padding: 8px 12px; border-radius: 8px; font-size: 13.5px; cursor: pointer; color: var(--text); }
  .file-chosen { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .file-chosen button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 12px; }
  .uploading-note { font-size: 13px; color: var(--accent); margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px 17px; }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .item-title { font-size: 15.5px; font-weight: 600; margin: 0 0 4px 0; }
  .item-link { font-size: 13px; color: var(--accent); word-break: break-all; text-decoration: none; }
  .item-link:hover { text-decoration: underline; }
  .item-desc { font-size: 14px; color: var(--text); margin: 6px 0 0 0; line-height: 1.5; white-space: pre-wrap; }
  .item-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .file-chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; background: var(--accent-soft); padding: 7px 12px; border-radius: 8px; font-size: 13px; color: var(--accent); text-decoration: none; }
  .file-chip:hover { text-decoration: underline; }
  .file-chip .fsize { color: #5C8E76; font-size: 12px; }

  .answer-toggle { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); background: var(--accent-soft); border: none; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-weight: 600; }
  .answer-box { margin-top: 10px; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
  .mastered-row { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); }
  .mastered-row input { accent-color: var(--accent); }

  .loading { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 14px; padding: 30px 0; }

  @media (max-width: 780px) {
    .sidebar { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform 0.2s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.25); }
    .sidebar.open { transform: translateX(0); }
    .close-btn { display: flex; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 15; }
    .mobile-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--paper); position: sticky; top: 0; z-index: 5; }
    .mobile-bar button { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
    .mobile-bar span { font-weight: 600; font-size: 15px; }
    .main { padding: 20px; }
    .chapter-header h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= helpers ================= */
function esc(s){ if (s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatBytes(b){ if (b===undefined||b===null) return ''; if (b<1024) return b+' B'; if (b<1024*1024) return (b/1024).toFixed(1)+' KB'; return (b/(1024*1024)).toFixed(1)+' MB'; }
function newId(){ return (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2,10))); }

const CONFIG_KEY = 'studyBinder_supabaseConfig_v1';
const BUCKET = 'uploads';

/* ================= global state ================= */
let sbClient = null;
let chapters = [];
let activeChapterId = null;
let activeTab = 'resources';
let resourcesCache = [], questionsCache = [], notesCache = [];
let revealed = {};

const ui = {
  sidebarOpen: false,
  addingChapter: false,
  editingChapterId: null,
  confirmDeleteChapterId: null,
  confirmResetAll: false,
};

let pendingFile = { resource: null, question: null };

/* ================= boot ================= */
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(CONFIG_KEY);
  if (saved) {
    try { connect(JSON.parse(saved)); }
    catch(e){ renderSetup('Saved configuration was invalid. Please enter it again.'); }
  } else {
    renderSetup();
  }
});

async function connect(config){
  try {
    sbClient = supabase.createClient(config.url, config.anonKey, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
    });
  } catch(e) {
    renderSetup('Could not create a client with that URL/key: ' + e.message);
    return;
  }
  const { error } = await sbClient.from('chapters').select('id').limit(1);
  if (error) {
    renderSetup('Connected to Supabase, but the query failed: ' + error.message + '. Make sure you ran the setup SQL script and that the URL/key are correct.');
    return;
  }
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  await loadChapters();
  renderShell();
}

function disconnect(){
  localStorage.removeItem(CONFIG_KEY);
  window.location.reload();
}

async function loadChapters(){
  const { data, error } = await sbClient.from('chapters').select('*').order('created_at');
  if (!error) chapters = data || [];
}

async function loadChapterItems(chapterId){
  const [r, q, n] = await Promise.all([
    sbClient.from('resources').select('*').eq('chapter_id', chapterId).order('created_at'),
    sbClient.from('questions').select('*').eq('chapter_id', chapterId).order('created_at'),
    sbClient.from('notes').select('*').eq('chapter_id', chapterId).order('created_at'),
  ]);
  resourcesCache = r.data || [];
  questionsCache = q.data || [];
  notesCache = n.data || [];
}

async function mountChapter(chapterId){
  activeChapterId = chapterId;
  activeTab = 'resources';
  revealed = {};
  renderMainInto();
  renderSidebarInto();
  await loadChapterItems(chapterId);
  renderList('resources'); renderList('questions'); renderList('notes');
}

/* ================= setup screen ================= */
function renderSetup(error){
  const app = document.getElementById('app');
  app.style.display = 'block';
  app.innerHTML = `
    <div class="setup-wrap">
      <h1 class="serif">Connect Study Binder to Supabase</h1>
      <p class="lead">This app stores your chapters, notes, and uploaded files in your own free Supabase project, so everything syncs across every device you open this page from. Takes a few minutes, one time.</p>
      ${error ? `<div class="setup-error">${esc(error)}</div>` : ''}
      <div class="setup-card">
        <h2>1. Create a Supabase project</h2>
        <ol>
          <li>Go to <strong>supabase.com</strong>, sign up, and click "New project" (it's free, no card needed).</li>
          <li>Once it finishes provisioning, open <strong>Project Settings &rarr; API</strong>.</li>
          <li>Copy the <strong>Project URL</strong> and the <strong>anon public</strong> key &mdash; you'll paste both below.</li>
        </ol>
      </div>
      <div class="setup-card">
        <h2>2. Create the tables</h2>
        <p class="hint">Open the <strong>SQL Editor</strong> in Supabase, paste this in, and click Run:</p>
        <div class="code-block" id="sqlBlock">create table if not exists chapters (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  created_at timestamptz default now()
);

create table if not exists resources (
  id uuid primary key default gen_random_uuid(),
  chapter_id uuid references chapters(id) on delete cascade,
  title text not null,
  url text,
  description text,
  file_url text,
  file_name text,
  file_path text,
  file_size bigint,
  created_at timestamptz default now()
);

create table if not exists questions (
  id uuid primary key default gen_random_uuid(),
  chapter_id uuid references chapters(id) on delete cascade,
  question text not null,
  answer text,
  mastered boolean default false,
  file_url text,
  file_name text,
  file_path text,
  file_size bigint,
  created_at timestamptz default now()
);

create table if not exists notes (
  id uuid primary key default gen_random_uuid(),
  chapter_id uuid references chapters(id) on delete cascade,
  title text not null,
  content text,
  created_at timestamptz default now()
);

alter table chapters enable row level security;
alter table resources enable row level security;
alter table questions enable row level security;
alter table notes enable row level security;

create policy "allow all chapters" on chapters for all using (true) with check (true);
create policy "allow all resources" on resources for all using (true) with check (true);
create policy "allow all questions" on questions for all using (true) with check (true);
create policy "allow all notes" on notes for all using (true) with check (true);<button class="copy-btn" data-action="copy" data-target="sql">Copy</button></div>
        <p class="hint">These policies allow full read/write access &mdash; fine here since it's your own private project just for your study data.</p>
      </div>
      <div class="setup-card">
        <h2>3. Create a storage bucket for files</h2>
        <ol>
          <li>Open <strong>Storage</strong> in the left menu, click "New bucket".</li>
          <li>Name it exactly <strong>uploads</strong> and toggle <strong>Public bucket</strong> ON, then create it.</li>
        </ol>
        <p class="hint">Then run this in the SQL Editor so uploads/deletes work through the app:</p>
        <div class="code-block" id="storageSqlBlock">create policy "public access to uploads"
on storage.objects for all
using (bucket_id = 'uploads')
with check (bucket_id = 'uploads');<button class="copy-btn" data-action="copy" data-target="storageSql">Copy</button></div>
      </div>
      <div class="setup-card">
        <h2>4. Connect</h2>
        <label class="field-label">Project URL</label>
        <input type="text" id="sbUrl" placeholder="https://xxxxxxxx.supabase.co" />
        <label class="field-label">anon public key</label>
        <input type="text" id="sbKey" placeholder="eyJhbGciOi..." />
        <div class="form-actions">
          <button class="btn primary" id="connectBtn" data-action="connect">Connect</button>
        </div>
      </div>
    </div>
  `;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'copy') {
    const blockId = el.dataset.target === 'sql' ? 'sqlBlock' : 'storageSqlBlock';
    const block = document.getElementById(blockId);
    const text = block.textContent.replace('Copy', '').trim();
    navigator.clipboard.writeText(text).then(() => { el.textContent = 'Copied'; setTimeout(()=> el.textContent='Copy', 1400); });
  }

  if (action === 'connect') {
    const url = document.getElementById('sbUrl').value.trim();
    const anonKey = document.getElementById('sbKey').value.trim();
    if (!url || !anonKey) return;
    el.disabled = true; el.textContent = 'Connecting...';
    connect({ url, anonKey }).then(() => {
      el.disabled = false; el.textContent = 'Connect';
    });
  }

  if (action === 'toggle-sidebar') { ui.sidebarOpen = true; renderSidebarInto(); }
  if (action === 'close-sidebar') { ui.sidebarOpen = false; renderSidebarInto(); }
  if (action === 'disconnect') { disconnect(); }

  if (action === 'select-chapter') { mountChapter(el.dataset.id); ui.sidebarOpen = false; }
  if (action === 'start-add-chapter') { ui.addingChapter = true; renderSidebarInto(); focusEl('newChapterInput'); }
  if (action === 'cancel-add-chapter') { ui.addingChapter = false; renderSidebarInto(); }
  if (action === 'submit-add-chapter') { submitAddChapter(); }
  if (action === 'start-rename') { ui.editingChapterId = el.dataset.id; renderSidebarInto(); focusEl('renameInput'); }
  if (action === 'cancel-rename') { ui.editingChapterId = null; renderSidebarInto(); }
  if (action === 'save-rename') { submitRename(el.dataset.id); }
  if (action === 'confirm-delete-chapter') { ui.confirmDeleteChapterId = el.dataset.id; renderSidebarInto(); }
  if (action === 'cancel-delete-chapter') { ui.confirmDeleteChapterId = null; renderSidebarInto(); }
  if (action === 'delete-chapter') { deleteChapter(el.dataset.id); }
  if (action === 'confirm-reset-all') { ui.confirmResetAll = true; renderSidebarInto(); }
  if (action === 'cancel-reset-all') { ui.confirmResetAll = false; renderSidebarInto(); }
  if (action === 'reset-all') { resetAll(); }

  if (action === 'open-resource-form') { openResourceForm(); }
  if (action === 'close-resource-form') { closeResourceForm(); }
  if (action === 'edit-resource') { openResourceForm(resourcesCache.find(r=>r.id===el.dataset.id)); }
  if (action === 'delete-resource') { deleteItem('resources', el.dataset.id, resourcesCache); }
  if (action === 'choose-resource-file') { document.getElementById('resourceFileInput').click(); }
  if (action === 'clear-resource-file') { pendingFile.resource = null; document.getElementById('resourceFileInput').value=''; renderResourceFileRow(); }
  if (action === 'remove-existing-resource-file') { document.getElementById('resourceFormArea').dataset.removeFile='1'; renderResourceFileRow(); }
  if (action === 'submit-resource-form') { submitResourceForm(); }

  if (action === 'open-question-form') { openQuestionForm(); }
  if (action === 'close-question-form') { closeQuestionForm(); }
  if (action === 'edit-question') { openQuestionForm(questionsCache.find(q=>q.id===el.dataset.id)); }
  if (action === 'delete-question') { deleteItem('questions', el.dataset.id, questionsCache); }
  if (action === 'choose-question-file') { document.getElementById('questionFileInput').click(); }
  if (action === 'clear-question-file') { pendingFile.question = null; document.getElementById('questionFileInput').value=''; renderQuestionFileRow(); }
  if (action === 'remove-existing-question-file') { document.getElementById('questionFormArea').dataset.removeFile='1'; renderQuestionFileRow(); }
  if (action === 'submit-question-form') { submitQuestionForm(); }
  if (action === 'toggle-answer') { revealed[el.dataset.id] = !revealed[el.dataset.id]; renderList('questions'); }
  if (action === 'toggle-mastered') { toggleMastered(el.dataset.id); }

  if (action === 'open-note-form') { openNoteForm(); }
  if (action === 'close-note-form') { closeNoteForm(); }
  if (action === 'edit-note') { openNoteForm(notesCache.find(n=>n.id===el.dataset.id)); }
  if (action === 'delete-note') { deleteItem('notes', el.dataset.id, notesCache); }
  if (action === 'submit-note-form') { submitNoteForm(); }
});

/* ================= chapters CRUD ================= */
async function submitAddChapter(){
  const input = document.getElementById('newChapterInput');
  const title = input ? input.value.trim() : '';
  if (!title) return;
  const { data, error } = await sbClient.from('chapters').insert({ title }).select().single();
  if (error) { alert('Could not add chapter: ' + error.message); return; }
  ui.addingChapter = false;
  await loadChapters();
  mountChapter(data.id);
}

async function submitRename(id){
  const input = document.getElementById('renameInput');
  const title = input ? input.value.trim() : '';
  ui.editingChapterId = null;
  if (!title) { renderSidebarInto(); return; }
  await sbClient.from('chapters').update({ title }).eq('id', id);
  await loadChapters();
  renderSidebarInto();
}

async function deleteChapter(id){
  ui.confirmDeleteChapterId = null;
  const [r, q] = await Promise.all([
    sbClient.from('resources').select('file_path').eq('chapter_id', id),
    sbClient.from('questions').select('file_path').eq('chapter_id', id),
  ]);
  const paths = [...(r.data||[]), ...(q.data||[])].map(x => x.file_path).filter(Boolean);
  if (paths.length) await sbClient.storage.from(BUCKET).remove(paths);
  await sbClient.from('chapters').delete().eq('id', id);
  if (activeChapterId === id) activeChapterId = null;
  await loadChapters();
  renderSidebarInto();
  renderMainInto();
}

async function resetAll(){
  ui.confirmResetAll = false;
  const ids = chapters.map(c => c.id);
  for (const id of ids) await deleteChapter(id);
  await loadChapters();
  renderSidebarInto();
  renderMainInto();
}

/* ================= generic item delete ================= */
async function deleteItem(kind, id, cache){
  const item = cache.find(i => i.id === id);
  if (item && item.file_path) { await sbClient.storage.from(BUCKET).remove([item.file_path]); }
  await sbClient.from(kind).delete().eq('id', id);
  await loadChapterItems(activeChapterId);
  renderList(kind);
}

async function uploadFile(path, file){
  const { error } = await sbClient.storage.from(BUCKET).upload(path, file, { upsert: true });
  if (error) throw error;
  const { data } = sbClient.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function renderList(kind){
  if (kind === 'resources') return renderResourceList();
  if (kind === 'questions') return renderQuestionList();
  if (kind === 'notes') return renderNoteList();
}

  }
  el.innerHTML = `<div class="list">` + notesCache.map(it => `
    <div class="item-card">
      <div class="item-top">
        <div style="flex:1;min-width:0;">
          <p class="item-title">${esc(it.title)}</p>
          ${it.content ? `<p class="item-desc">${esc(it.content)}</p>` : ''}
        </div>
        <div class="item-actions">
          <button class="icon-btn dim" data-action="edit-note" data-id="${it.id}">&#9998;</button>
          <button class="icon-btn dim" data-action="delete-note" data-id="${it.id}">&#128465;</button>
        </div>
      </div>
    </div>`).join('') + `</div>`;
}
</script>
</body>
</html>
